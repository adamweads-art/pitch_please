name: Build matchweek feed

on:
  schedule:
    # Two attempts, both deliberately off the top of the hour. GitHub queues
    # scheduled runs on a shared pool and drops them under load, and ":00" is
    # by far the most contended minute. The second run is a backstop: the build
    # overwrites the same file and the commit step skips when nothing changed,
    # so a duplicate run is harmless.
    - cron: "37 4 * * 2"   # Mon 9:37pm Pacific (PDT)
    - cron: "37 6 * * 2"   # Mon 11:37pm Pacific, if the first didn't fire
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the feed
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/build-matchweek.mjs

      - name: Commit if the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet matchweek.json; then
            echo "No change to matchweek.json, nothing to commit."
          else
            git add matchweek.json
            git commit -m "Update matchweek feed"
            git push
          fi
